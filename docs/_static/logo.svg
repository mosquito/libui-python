<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3776ab"/>
      <stop offset="100%" stop-color="#2b6090"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>

  <!-- Mini window frame -->
  <rect x="20" y="22" width="88" height="62" rx="6" fill="#1e3a5c" opacity="0.6"/>
  <rect x="20" y="22" width="88" height="14" rx="6" fill="#1e3a5c" opacity="0.8"/>
  <rect x="20" y="30" width="88" height="6" fill="#1e3a5c" opacity="0.8"/>
  <circle cx="30" cy="29" r="2.5" fill="#ff5f57" opacity="0.9"/>

  <!-- Checkbox inside window -->
  <rect x="32" y="46" width="20" height="20" rx="4" fill="#ffd43b"/>
  <polyline points="37,56 41,61 49,50" stroke="#2b6090" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Label widget next to checkbox -->
  <rect x="60" y="50" width="36" height="10" rx="3" fill="#fff" opacity="0.35"/>

  <!-- "libui" text -->
  <text x="64" y="110" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.5">libui</text>
</svg>
